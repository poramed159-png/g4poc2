<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>My Simple Web</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
    }
    header {
      background: #1e90ff;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .container {
      padding: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      max-width: 500px;
      margin: auto;
    }
    button {
      background: #1e90ff;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #187bcd;
    }
  </style>
</head>
<body>

  <header>
    <h1>Welcome</h1>
    <p>เว็บตัวอย่าง HTML ง่าย ๆ</p>
  </header>

  <div class="container">
    <div class="card">
      <h2>สวัสดีครับ 👋</h2>
      <p>นี่คือหน้าเว็บ HTML แบบง่าย ใช้ไฟล์เดียว</p>
      <button onclick="sayHello()">กดดูข้อความ</button>
      <p id="msg"></p>
    </div>
  </div>

  <script>
    function sayHello() {
      document.getElementById("msg").innerText = "ยินดีต้อนรับสู่เว็บของคุณ!";
    }
  </script>

</body>
</html>
